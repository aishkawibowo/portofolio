<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="rpnBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1527" />
      <stop offset="100%" stop-color="#120E1A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#rpnBg)"/>
  <rect width="800" height="500" rx="16" stroke="#594466" stroke-width="1.5"/>

  <!-- Top Window Header -->
  <rect width="800" height="42" fill="#241B30" rx="16"/>
  <rect y="30" width="800" height="12" fill="#241B30"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#594466" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A99AB8" text-anchor="middle">Google Looker Studio — Dashboard Analitik Produksi PT Riset Perkebunan Nusantara</text>

  <!-- Looker Bar / Controls -->
  <g transform="translate(30, 56)">
    <rect width="740" height="45" rx="8" fill="#1D1626" stroke="#594466" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Laporan Produksi Perkebunan Nusantara</text>
    
    <rect x="490" y="10" width="115" height="25" rx="6" fill="#382747"/>
    <text x="547" y="27" font-family="system-ui, sans-serif" font-size="10" fill="#C4A1FF" text-anchor="middle">Filter: Q2 2025 ▼</text>

    <rect x="615" y="10" width="110" height="25" rx="6" fill="#5D3B80"/>
    <text x="670" y="27" font-family="system-ui, sans-serif" font-size="10" fill="#FAF5FF" font-weight="600" text-anchor="middle">Export Data ⤓</text>
  </g>

  <!-- Metric KPIs -->
  <g transform="translate(30, 115)">
    <rect width="170" height="75" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="16" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">TOTAL PRODUKSI</text>
    <text x="16" y="55" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FAF5FF">128,450 Ton</text>

    <rect x="190" width="170" height="75" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="206" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">PENCAPAIAN TARGET</text>
    <text x="206" y="55" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#A8D5BA">104.8%</text>

    <rect x="380" width="170" height="75" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="396" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">RENDEMEN MINYAK</text>
    <text x="396" y="55" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#C4A1FF">23.2%</text>

    <rect x="570" width="170" height="75" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="586" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">DATA QUALITY SCORE</text>
    <text x="586" y="55" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38BDF8">99.8%</text>
  </g>

  <!-- Big Interactive Chart Area -->
  <g transform="translate(30, 205)">
    <rect width="740" height="270" rx="12" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAF5FF">Grafik Komparasi Hasil Panen per Kebun (Looker Studio)</text>

    <!-- Grid lines -->
    <line x1="50" y1="210" x2="690" y2="210" stroke="#594466" stroke-width="1"/>
    <line x1="50" y1="160" x2="690" y2="160" stroke="#594466" stroke-dasharray="3 3" opacity="0.3"/>
    <line x1="50" y1="110" x2="690" y2="110" stroke="#594466" stroke-dasharray="3 3" opacity="0.3"/>
    <line x1="50" y1="60" x2="690" y2="60" stroke="#594466" stroke-dasharray="3 3" opacity="0.3"/>

    <!-- Bar Group 1 -->
    <rect x="90" y="80" width="28" height="130" rx="4" fill="#C4A1FF"/>
    <rect x="122" y="100" width="28" height="110" rx="4" fill="#E6A8C7"/>
    <text x="120" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8" text-anchor="middle">Kebun A (Sawit)</text>

    <!-- Bar Group 2 -->
    <rect x="210" y="60" width="28" height="150" rx="4" fill="#C4A1FF"/>
    <rect x="242" y="75" width="28" height="135" rx="4" fill="#E6A8C7"/>
    <text x="240" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8" text-anchor="middle">Kebun B (Karet)</text>

    <!-- Bar Group 3 -->
    <rect x="330" y="110" width="28" height="100" rx="4" fill="#C4A1FF"/>
    <rect x="362" y="130" width="28" height="80" rx="4" fill="#E6A8C7"/>
    <text x="360" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8" text-anchor="middle">Kebun C (Teh)</text>

    <!-- Bar Group 4 -->
    <rect x="450" y="70" width="28" height="140" rx="4" fill="#C4A1FF"/>
    <rect x="482" y="85" width="28" height="125" rx="4" fill="#E6A8C7"/>
    <text x="480" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8" text-anchor="middle">Kebun D (Kopi)</text>

    <!-- Bar Group 5 -->
    <rect x="570" y="95" width="28" height="115" rx="4" fill="#C4A1FF"/>
    <rect x="602" y="110" width="28" height="100" rx="4" fill="#E6A8C7"/>
    <text x="600" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8" text-anchor="middle">Kebun E (Kakao)</text>
  </g>
</svg>