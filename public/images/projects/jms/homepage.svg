<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none">
  <defs>
    <linearGradient id="jmsBg" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1527" />
      <stop offset="100%" stop-color="#120D1A" />
    </linearGradient>
  </defs>

  <rect width="900" height="560" rx="16" fill="url(#jmsBg)"/>
  <rect width="900" height="560" rx="16" stroke="#594466" stroke-width="1.5"/>

  <!-- Window Bar -->
  <rect width="900" height="42" fill="#241B30" rx="16"/>
  <rect y="30" width="900" height="12" fill="#241B30"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#594466" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.85"/>
  <text x="450" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A99AB8" text-anchor="middle">Jaya Makmur Sentosa (JMS) — Food Processing Machinery Corporate Website</text>

  <!-- Website Navbar -->
  <g transform="translate(0, 42)">
    <rect width="900" height="52" fill="#1D1626"/>
    <line x1="0" y1="52" x2="900" y2="52" stroke="#594466" stroke-width="1"/>
    
    <rect x="35" y="14" width="28" height="24" rx="4" fill="#C4A1FF"/>
    <text x="49" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#17121F" text-anchor="middle">JMS</text>
    <text x="72" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FAF5FF">JAYA MAKMUR SENTOSA</text>

    <!-- Nav Items -->
    <text x="380" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#C4A1FF">Beranda</text>
    <text x="450" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#A99AB8">Produk Mesin</text>
    <text x="550" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#A99AB8">Proses Fabrikasi</text>
    <text x="660" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#A99AB8">Tentang Kami</text>

    <rect x="765" y="12" width="105" height="28" rx="6" fill="#C4A1FF"/>
    <text x="817" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#21152F" text-anchor="middle">Katalog Mesin</text>
  </g>

  <!-- Hero Section of JMS Website -->
  <g transform="translate(35, 115)">
    <rect width="830" height="190" rx="14" fill="#241B30" stroke="#594466" stroke-width="1"/>
    
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C4A1FF" letter-spacing="1.5">MANUFAKTUR MESIN PENGOLAHAN MAKANAN INDUSTRI</text>
    <text x="35" y="85" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#FAF5FF">Solusi Mesin Presisi untuk Pabrik</text>
    <text x="35" y="115" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#FAF5FF">Wafer Stick &amp; Confectionery Modern</text>
    <text x="35" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#D4C9E2">Mulai dari Caramel Crispy, Enrober Cooling Tunnel, Ball Mill Premixer, hingga Conveyor System.</text>

    <!-- Visual Machine Preview Box -->
    <rect x="560" y="25" width="235" height="140" rx="10" fill="#1D1626" stroke="#594466" stroke-width="1"/>
    <rect x="580" y="45" width="195" height="80" rx="6" fill="#382747"/>
    <text x="677" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E6A8C7" text-anchor="middle">Industrial Wafer Oven 36-Plate</text>
    <text x="677" y="108" font-family="monospace" font-size="10" fill="#A8D5BA" text-anchor="middle">Capacity: 450 kg/hour</text>
  </g>

  <!-- Product Categories Grid -->
  <g transform="translate(35, 325)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FAF5FF">Lini Produk Mesin Unggulan (9 Kategori Terverifikasi)</text>

    <!-- Card 1 -->
    <g transform="translate(0, 15)">
      <rect width="190" height="175" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
      <rect x="15" y="15" width="160" height="75" rx="6" fill="#1D1626"/>
      <circle cx="95" cy="52" r="22" fill="#382747"/>
      <text x="95" y="57" font-family="monospace" font-size="14" fill="#C4A1FF" text-anchor="middle">⚙</text>
      <text x="15" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Caramel Crispy Line</text>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">Cooking &amp; forming otomatis</text>
      <text x="15" y="152" font-family="monospace" font-size="10" fill="#A8D5BA">Full Stainless 304</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(210, 15)">
      <rect width="190" height="175" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
      <rect x="15" y="15" width="160" height="75" rx="6" fill="#1D1626"/>
      <circle cx="95" cy="52" r="22" fill="#382747"/>
      <text x="95" y="57" font-family="monospace" font-size="14" fill="#38BDF8" text-anchor="middle">❄</text>
      <text x="15" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Enrober &amp; Cooling</text>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">Pelapisan cokelat presisi</text>
      <text x="15" y="152" font-family="monospace" font-size="10" fill="#38BDF8">Temp: -5°C to 15°C</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(420, 15)">
      <rect width="190" height="175" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
      <rect x="15" y="15" width="160" height="75" rx="6" fill="#1D1626"/>
      <circle cx="95" cy="52" r="22" fill="#382747"/>
      <text x="95" y="57" font-family="monospace" font-size="14" fill="#E6A8C7" text-anchor="middle">🌀</text>
      <text x="15" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Ball Mill Premixer</text>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">Penghalus cokelat pasta</text>
      <text x="15" y="152" font-family="monospace" font-size="10" fill="#E6A8C7">Fineness: 20-25 µm</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(630, 15)">
      <rect width="200" height="175" rx="10" fill="#241B30" stroke="#594466" stroke-width="1"/>
      <rect x="15" y="15" width="170" height="75" rx="6" fill="#1D1626"/>
      <circle cx="100" cy="52" r="22" fill="#382747"/>
      <text x="100" y="57" font-family="monospace" font-size="14" fill="#C4A1FF" text-anchor="middle">📦</text>
      <text x="15" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Auto Cup Sealer</text>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">Packaging &amp; conveyor line</text>
      <text x="15" y="152" font-family="monospace" font-size="10" fill="#A8D5BA">Speed: 4,000 cup/h</text>
    </g>
  </g>
</svg>