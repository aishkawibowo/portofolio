<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none">
  <defs>
    <linearGradient id="glacierBg" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181324" />
      <stop offset="100%" stop-color="#100A18" />
    </linearGradient>
  </defs>

  <rect width="900" height="560" rx="16" fill="url(#glacierBg)"/>
  <rect width="900" height="560" rx="16" stroke="#594466" stroke-width="1.5"/>

  <!-- Desktop App Header (JavaFX Style) -->
  <rect width="900" height="42" fill="#241B30" rx="16"/>
  <rect y="30" width="900" height="12" fill="#241B30"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#594466" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.85"/>
  <text x="450" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A99AB8" text-anchor="middle">GlacierCube — Desktop CRUD Database Client (JavaFX 21 &amp; MySQL JDBC)</text>

  <!-- Left: Database Tree & Connection Explorer -->
  <g transform="translate(25, 60)">
    <rect width="220" height="475" rx="12" fill="#1D1626" stroke="#594466" stroke-width="1"/>
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF5FF">Koneksi JDBC Explorer</text>
    
    <rect x="15" y="44" width="190" height="26" rx="6" fill="#382747"/>
    <circle cx="28" cy="57" r="4" fill="#A8D5BA"/>
    <text x="40" y="61" font-family="monospace" font-size="11" fill="#FAF5FF">localhost:3306 (MySQL)</text>

    <!-- Schema tree -->
    <text x="25" y="100" font-family="monospace" font-size="11" fill="#C4A1FF">📁 db_glaciercube</text>
    <text x="45" y="125" font-family="monospace" font-size="11" fill="#FAF5FF">↳ 📋 tbl_inventory (Active)</text>
    <text x="45" y="150" font-family="monospace" font-size="11" fill="#A99AB8">↳ 📋 tbl_transactions</text>
    <text x="45" y="175" font-family="monospace" font-size="11" fill="#A99AB8">↳ 📋 tbl_users_auth</text>
    <text x="45" y="200" font-family="monospace" font-size="11" fill="#A99AB8">↳ 📋 tbl_audit_logs</text>

    <line x1="15" y1="230" x2="205" y2="230" stroke="#594466" stroke-width="0.8"/>

    <text x="18" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Prepared Statements</text>
    <text x="18" y="280" font-family="monospace" font-size="10" fill="#A8D5BA">✓ SQL Injection Safe</text>
    <text x="18" y="300" font-family="monospace" font-size="10" fill="#A8D5BA">✓ ACID Transactions</text>
    <text x="18" y="320" font-family="monospace" font-size="10" fill="#C4A1FF">✓ Connection Pool: 10</text>

    <!-- Quick action buttons -->
    <rect x="15" y="420" width="190" height="32" rx="6" fill="#5D3B80"/>
    <text x="110" y="441" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF" text-anchor="middle">+ Input Data Baru</text>
  </g>

  <!-- Right: SQL Query Editor & Table Grid -->
  <g transform="translate(260, 60)">
    <!-- SQL Query Box -->
    <rect width="615" height="110" rx="12" fill="#140F1D" stroke="#594466" stroke-width="1"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A99AB8">SQL QUERY EDITOR (PREPARED STATEMENT)</text>
    
    <text x="20" y="55" font-family="monospace" font-size="12" fill="#C4A1FF">SELECT</text>
    <text x="75" y="55" font-family="monospace" font-size="12" fill="#FAF5FF">item_id, item_name, category, stock_qty, price_unit, updated_at</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#C4A1FF">FROM</text>
    <text x="60" y="75" font-family="monospace" font-size="12" fill="#FAF5FF">tbl_inventory</text>
    <text x="165" y="75" font-family="monospace" font-size="12" fill="#C4A1FF">WHERE</text>
    <text x="215" y="75" font-family="monospace" font-size="12" fill="#FAF5FF">status = ?</text>
    <text x="300" y="75" font-family="monospace" font-size="12" fill="#C4A1FF">ORDER BY</text>
    <text x="375" y="75" font-family="monospace" font-size="12" fill="#FAF5FF">stock_qty DESC;</text>

    <rect x="520" y="20" width="80" height="26" rx="6" fill="#A8D5BA" fill-opacity="0.2"/>
    <text x="560" y="37" font-family="monospace" font-size="11" font-weight="700" fill="#A8D5BA" text-anchor="middle">Execute ▶</text>

    <!-- Table Grid (TableView JavaFX) -->
    <g transform="translate(0, 125)">
      <rect width="615" height="350" rx="12" fill="#241B30" stroke="#594466" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="615" height="36" rx="12" fill="#30223D"/>
      <rect y="24" width="615" height="12" fill="#30223D"/>
      <text x="20" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#D4C9E2">ID</text>
      <text x="90" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#D4C9E2">NAMA BARANG</text>
      <text x="260" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#D4C9E2">KATEGORI</text>
      <text x="390" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#D4C9E2">STOK</text>
      <text x="470" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#D4C9E2">HARGA SATUAN</text>

      <!-- Row 1 -->
      <line x1="0" y1="36" x2="615" y2="36" stroke="#594466" stroke-width="1"/>
      <text x="20" y="64" font-family="monospace" font-size="11" fill="#C4A1FF">#1024</text>
      <text x="90" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF5FF">Inverter VFD 3-Phase 5.5kW</text>
      <text x="260" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8">Electrical</text>
      <text x="390" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#A8D5BA">142 unit</text>
      <text x="470" y="64" font-family="monospace" font-size="11" fill="#FAF5FF">Rp 4.250.000</text>

      <!-- Row 2 -->
      <line x1="0" y1="84" x2="615" y2="84" stroke="#594466" stroke-width="0.7"/>
      <text x="20" y="112" font-family="monospace" font-size="11" fill="#C4A1FF">#1025</text>
      <text x="90" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF5FF">DO Probe Sensor Optical WQMS</text>
      <text x="260" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8">Sensor IoT</text>
      <text x="390" y="112" font-family="monospace" font-size="11" font-weight="700" fill="#A8D5BA">85 unit</text>
      <text x="470" y="112" font-family="monospace" font-size="11" fill="#FAF5FF">Rp 2.800.000</text>

      <!-- Row 3 -->
      <line x1="0" y1="132" x2="615" y2="132" stroke="#594466" stroke-width="0.7"/>
      <text x="20" y="160" font-family="monospace" font-size="11" fill="#C4A1FF">#1026</text>
      <text x="90" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF5FF">Paddlewheel Kincir 4-Daun</text>
      <text x="260" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8">Mechanical</text>
      <text x="390" y="160" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B">24 unit (Low)</text>
      <text x="470" y="160" font-family="monospace" font-size="11" fill="#FAF5FF">Rp 1.150.000</text>

      <!-- Row 4 -->
      <line x1="0" y1="180" x2="615" y2="180" stroke="#594466" stroke-width="0.7"/>
      <text x="20" y="208" font-family="monospace" font-size="11" fill="#C4A1FF">#1027</text>
      <text x="90" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF5FF">Solar Feeder Module 100W</text>
      <text x="260" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8">Renewable</text>
      <text x="390" y="208" font-family="monospace" font-size="11" font-weight="700" fill="#A8D5BA">60 unit</text>
      <text x="470" y="208" font-family="monospace" font-size="11" fill="#FAF5FF">Rp 1.650.000</text>

      <!-- Pagination bottom bar -->
      <rect y="310" width="615" height="40" rx="12" fill="#1D1626"/>
      <text x="20" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#A99AB8">Menampilkan 1-4 dari 48 total data barang</text>
      <text x="590" y="334" font-family="monospace" font-size="11" fill="#C4A1FF" text-anchor="end">Query Time: 14.2 ms</text>
    </g>
  </g>
</svg>