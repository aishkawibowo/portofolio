<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <linearGradient id="iotDarkBg2" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181222" />
      <stop offset="100%" stop-color="#110B18" />
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="16" fill="url(#iotDarkBg2)"/>
  <rect width="960" height="600" rx="16" stroke="#594466" stroke-width="1.5"/>

  <!-- macOS Window Bar -->
  <rect width="960" height="42" fill="#241B30" rx="16"/>
  <rect y="30" width="960" height="12" fill="#241B30"/>
  <line x1="0" y1="42" x2="960" y2="42" stroke="#594466" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.85"/>
  <text x="480" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A99AB8" text-anchor="middle">Venambak IoT — AutoVenjet VFD Inverter Controller &amp; GPS Telemetry (AutoVenjetDetail.tsx)</text>

  <!-- Left: GPS & Device Telemetry (from AutoVenjetDetail.tsx: lat, lng, speed, heading, battery) -->
  <g transform="translate(25, 60)">
    <rect width="440" height="515" rx="14" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAF5FF">Telemetri Real-Time AutoVenjet #01</text>
    <text x="20" y="50" font-family="monospace" font-size="10" fill="#A8D5BA">● Status: ONLINE (VFD Inverter Running)</text>

    <!-- GPS Map Box (600x260 d3-geo topojson simulation from source code) -->
    <rect x="20" y="65" width="400" height="200" rx="10" fill="#140F1D" stroke="#594466" stroke-width="1"/>
    
    <!-- Grid -->
    <line x1="20" y1="115" x2="420" y2="115" stroke="#594466" stroke-dasharray="2 3" opacity="0.3"/>
    <line x1="20" y1="165" x2="420" y2="165" stroke="#594466" stroke-dasharray="2 3" opacity="0.3"/>
    <line x1="20" y1="215" x2="420" y2="215" stroke="#594466" stroke-dasharray="2 3" opacity="0.3"/>

    <!-- Pond Coordinates Simulation -->
    <rect x="160" y="120" width="100" height="60" rx="6" fill="#382747" stroke="#C4A1FF" stroke-width="1.5"/>
    <text x="210" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF" text-anchor="middle">KOLAM A1</text>

    <circle cx="210" cy="150" r="14" fill="#A8D5BA" fill-opacity="0.3"/>
    <circle cx="210" cy="150" r="4" fill="#A8D5BA"/>

    <text x="30" y="250" font-family="monospace" font-size="9" fill="#A99AB8">LAT: -7.4721° S  |  LNG: 112.7214° E  |  ALT: 12m</text>

    <!-- Parameter Badges Grid (from GpsData interface in source code) -->
    <g transform="translate(20, 280)">
      <!-- Speed -->
      <rect width="190" height="65" rx="8" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">KECEPATAN MOTOR</text>
      <text x="14" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FAF5FF">1,420 RPM</text>

      <!-- Battery / Voltage -->
      <rect x="210" width="190" height="65" rx="8" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="224" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">TEGANGAN 3-PHASE</text>
      <text x="224" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#A8D5BA">382 Volt</text>

      <!-- Frequency -->
      <rect y="78" width="190" height="65" rx="8" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="14" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">FREKUENSI INVERTER</text>
      <text x="14" y="126" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#C4A1FF">48.5 Hz</text>

      <!-- Load Current -->
      <rect x="210" y="78" width="190" height="65" rx="8" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="224" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">ARUS BEBAN (AMPERE)</text>
      <text x="224" y="126" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">4.2 A</text>

      <!-- Active Since -->
      <rect y="156" width="400" height="60" rx="8" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="14" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#A99AB8">AKTIF SEJAK (DURASI KERJA MESIN)</text>
      <text x="14" y="202" font-family="monospace" font-size="14" font-weight="700" fill="#FAF5FF">24 Jam 18 Menit • 0 Gangguan Overheat</text>
    </g>
  </g>

  <!-- Right: VFD Remote Control Panel & DurasiJadwal.tsx -->
  <g transform="translate(490, 60)">
    <rect width="445" height="515" rx="14" fill="#241B30" stroke="#594466" stroke-width="1"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAF5FF">Kontrol Kecepatan Inverter VFD &amp; Penjadwalan</text>

    <!-- Speed Slider Mockup -->
    <g transform="translate(24, 60)">
      <rect width="395" height="110" rx="10" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="18" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Set Target Frekuensi (Hz)</text>
      <text x="375" y="26" font-family="monospace" font-size="13" font-weight="800" fill="#C4A1FF" text-anchor="end">48.5 Hz</text>

      <!-- Slider Track -->
      <rect x="18" y="48" width="360" height="8" rx="4" fill="#382747"/>
      <rect x="18" y="48" width="280" height="8" rx="4" fill="#C4A1FF"/>
      <circle cx="298" cy="52" r="10" fill="#FAF5FF" stroke="#C4A1FF" stroke-width="3"/>

      <!-- Presets -->
      <rect x="18" y="72" width="75" height="24" rx="6" fill="#382747"/>
      <text x="55" y="88" font-family="monospace" font-size="10" fill="#FAF5FF" text-anchor="middle">30 Hz</text>

      <rect x="105" y="72" width="75" height="24" rx="6" fill="#382747"/>
      <text x="142" y="88" font-family="monospace" font-size="10" fill="#FAF5FF" text-anchor="middle">40 Hz</text>

      <rect x="192" y="72" width="75" height="24" rx="6" fill="#5D3B80"/>
      <text x="229" y="88" font-family="monospace" font-size="10" font-weight="700" fill="#FAF5FF" text-anchor="middle">50 Hz (Full)</text>

      <rect x="280" y="72" width="98" height="24" rx="6" fill="#A8D5BA" fill-opacity="0.2"/>
      <text x="329" y="88" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#A8D5BA" text-anchor="middle">Auto Eco Mode</text>
    </g>

    <!-- DurasiJadwal.tsx: Automated Schedule Matrix -->
    <g transform="translate(24, 185)">
      <rect width="395" height="225" rx="10" fill="#1D1626" stroke="#594466" stroke-width="0.8"/>
      <text x="18" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Jadwal Operasi Aerasi Otomatis (DurasiJadwal.tsx)</text>

      <!-- Slot 1 -->
      <g transform="translate(18, 42)">
        <rect width="360" height="42" rx="6" fill="#241B30" stroke="#594466" stroke-width="0.7"/>
        <text x="14" y="26" font-family="monospace" font-size="11" fill="#FAF5FF">06:00 — 09:00 WIB</text>
        <rect x="180" y="11" width="65" height="20" rx="10" fill="#C4A1FF" fill-opacity="0.2"/>
        <text x="212" y="25" font-family="monospace" font-size="10" fill="#C4A1FF" text-anchor="middle">45.0 Hz</text>
        <text x="345" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#A8D5BA" text-anchor="end">AKTIF ✓</text>
      </g>

      <!-- Slot 2 -->
      <g transform="translate(18, 92)">
        <rect width="360" height="42" rx="6" fill="#241B30" stroke="#594466" stroke-width="0.7"/>
        <text x="14" y="26" font-family="monospace" font-size="11" fill="#FAF5FF">12:00 — 14:00 WIB</text>
        <rect x="180" y="11" width="65" height="20" rx="10" fill="#38BDF8" fill-opacity="0.2"/>
        <text x="212" y="25" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle">35.0 Hz</text>
        <text x="345" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#A8D5BA" text-anchor="end">AKTIF ✓</text>
      </g>

      <!-- Slot 3 (Night Peak DO Oxygen Boost) -->
      <g transform="translate(18, 142)">
        <rect width="360" height="42" rx="6" fill="#382747" stroke="#C4A1FF" stroke-width="1"/>
        <text x="14" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#FAF5FF">21:00 — 05:00 WIB (Peak)</text>
        <rect x="180" y="11" width="65" height="20" rx="10" fill="#C4A1FF"/>
        <text x="212" y="25" font-family="monospace" font-size="10" font-weight="700" fill="#17121F" text-anchor="middle">50.0 Hz</text>
        <text x="345" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C4A1FF" text-anchor="end">BOOST DO</text>
      </g>
    </g>

    <!-- Emergency Kill Switch / Safe Stop -->
    <rect x="24" y="430" width="395" height="48" rx="8" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
    <text x="221" y="460" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle">EMERGENCY STOP (SHUTDOWN INVERTER)</text>
  </g>
</svg>